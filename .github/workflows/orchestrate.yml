name: Multi-Agent Orchestration

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - 'feature/**'
      - 'repair/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review-proposals:
    name: Generate AI review proposals (no automatic code changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build change summary
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --no-ext-diff --unified=3 "origin/$BASE_REF...HEAD" > change.diff
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          else
            git fetch origin master --depth=1
            git diff --no-ext-diff --unified=3 "origin/master..HEAD" > change.diff
            git diff --name-only "origin/master..HEAD" > changed-files.txt
          fi
          {
            echo 'diff<<TT_DIFF_EOF'
            cat change.diff
            echo
            echo 'TT_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'files<<TT_FILES_EOF'
            cat changed-files.txt
            echo
            echo 'TT_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Changed files"
            if [[ -s changed-files.txt ]]; then cat changed-files.txt; else echo "(No file differences from target branch.)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OpenAI review proposal (optional secret)
        id: openai
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIFF: ${{ steps.diff.outputs.diff }}
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              proposal = "SKIPPED: OPENAI_API_KEY repository secret is not configured."
          else:
              prompt = ("Review this repository diff. Do not claim tests ran. Return concise JSON with keys "
                        "summary, risks, recommended_actions.\nChanged files:\n" +
                        os.environ.get("FILES", "") + "\nDiff:\n" + os.environ.get("DIFF", "")[:50000])
              req = urllib.request.Request(
                  "https://api.openai.com/v1/chat/completions",
                  data=json.dumps({"model":"gpt-4o","messages":[{"role":"user","content":prompt}],
                                   "temperature":0.2}).encode(),
                  headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = json.loads(response.read().decode())
                  proposal = data["choices"][0]["message"]["content"].strip()
              except Exception as exc:
                  proposal = "ERROR: OpenAI review failed: " + str(exc)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("proposal<<TT_OPENAI_EOF\n" + proposal.replace("\nTT_OPENAI_EOF", "") + "\nTT_OPENAI_EOF\n")
          with open("openai-proposal.md", "w", encoding="utf-8") as out:
              out.write("## OpenAI proposal\n\n" + proposal + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## OpenAI proposal\n\n" + proposal + "\n")
          PY

      - name: DeepSeek review proposal (optional secret)
        id: deepseek
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIFF: ${{ steps.diff.outputs.diff }}
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ.get("DEEPSEEK_API_KEY", "")
          if not key:
              proposal = "SKIPPED: DEEPSEEK_API_KEY repository secret is not configured."
          else:
              prompt = ("Review this repository diff independently. Do not claim tests ran. Return concise JSON with keys "
                        "summary, risks, recommended_actions.\nChanged files:\n" +
                        os.environ.get("FILES", "") + "\nDiff:\n" + os.environ.get("DIFF", "")[:50000])
              req = urllib.request.Request(
                  "https://api.deepseek.com/chat/completions",
                  data=json.dumps({"model":"deepseek-chat","messages":[{"role":"user","content":prompt}],
                                   "temperature":0.2}).encode(),
                  headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = json.loads(response.read().decode())
                  proposal = data["choices"][0]["message"]["content"].strip()
              except Exception as exc:
                  proposal = "ERROR: DeepSeek review failed: " + str(exc)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("proposal<<TT_DEEPSEEK_EOF\n" + proposal.replace("\nTT_DEEPSEEK_EOF", "") + "\nTT_DEEPSEEK_EOF\n")
          with open("deepseek-proposal.md", "w", encoding="utf-8") as out:
              out.write("## DeepSeek proposal\n\n" + proposal + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## DeepSeek proposal\n\n" + proposal + "\n")
          PY

      - name: Record human-review gate
        shell: bash
        run: |
          {
            echo "## Decision gate"
            echo "This workflow produces review proposals only. It does not edit, commit, push, or merge source code."
            echo "A human must verify any recommendation and approve code changes through the normal pull-request process."
            echo "The workflow does not claim that Claude or another third-party agent reviewed this change unless a real integration is configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const openai = fs.readFileSync('openai-proposal.md', 'utf8');
            const deepseek = fs.readFileSync('deepseek-proposal.md', 'utf8');
            const body = [
              '## AI review proposals',
              '',
              openai,
              '',
              deepseek,
              '',
              '**Human review required:** these are proposals, not verified findings. No source files were changed by this workflow.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
