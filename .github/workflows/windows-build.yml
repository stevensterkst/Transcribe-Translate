name: Windows build
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Final source and Windows build audit
        shell: pwsh
        run: .\verify-final.ps1
      - name: Package verified Windows bundle
        shell: pwsh
        run: Compress-Archive -Path "dist\SS-Transcribe-Translate\*" -DestinationPath "SS-Transcribe-Translate-Windows.zip" -Force
      - name: Upload EXE bundle, ZIP and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: SS-Transcribe-Translate-Windows
          path: |
            dist/SS-Transcribe-Translate/
            SS-Transcribe-Translate-Windows.zip
            FINAL-AUDIT-*.log
            SHA256.txt
